<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <ul>
                <li><img src="icons/view-dashboard.svg">Dashboard</li>
            </ul>
            <ul>
                <li><img src="icons/home.svg">Home</li>
                <li><img src="icons/card-account-details-outline.svg">Profile</li>
                <li><img src="icons/message-reply.svg">Messages</li>
                <li><img src="icons/clock-time-three-outline.svg">History</li>
                <li><img src="icons/file-multiple-outline.svg">Tasks</li>
                <li><img src="icons/account-group.svg">Communities</li>
            </ul>
            <ul>
                <li><img src="icons/cog.svg">Setings</li>
                <li><img src="icons/help-box.svg">Support</li>
                <li><img src="icons/shield-check.svg">Privacy</li>
            </ul>
        </div>

        <div class="header">
            <div class="top-row">
                <img src="icons/magnify.svg">
                <input type="text">
                <img src="icons/bell-ring-outline.svg">
                <img src="icons/face-woman-profile.svg">
                <p class="profile-text">Morgan Oakley</p>
            </div>
        
            <div class="bottom-row">
                <img src="icons/face-woman-profile.svg">
                <p class="profile-text">Hi there,</p>
                <p class="profile-text">Morgan Oakley</p>
                <button>New</button>
                <button>Upload</button>
                <button>Share</button>
            </div>
        </div>

        <div class="projects">
            
        </div>
    </div>
</body>
</html>
